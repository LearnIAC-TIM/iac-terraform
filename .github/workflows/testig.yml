name: Verifiser innlogging mot Azure
 
on:
  workflow_dispatch:
 
permissions:
  id-token: write
  contents: read
 
jobs:
  verifiser:
    runs-on: ubuntu-latest
 
    environment: dev
 
    steps:
      - name: Logg inn i Azure med OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
 
      - name: Hvem ble jeg?
        run: az account show --output table